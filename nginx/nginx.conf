# HTTP → HTTPS redirect
server {
    listen 80;
    server_name duskai.net www.duskai.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name duskai.net www.duskai.net;
    client_max_body_size 20M;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Docker's embedded DNS server. Combined with the variables in proxy_pass below,
    # nginx re-resolves the upstream hostnames per request (re-checking every 10s)
    # instead of caching the container IP once at startup. This means a redeployed
    # fastapi/nextjs container's new IP is picked up automatically and never causes a
    # stale-upstream "502 Bad Gateway".
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $fastapi_upstream http://fastapi:8000;
        proxy_pass $fastapi_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $nextjs_upstream http://nextjs:3000;
        proxy_pass $nextjs_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
